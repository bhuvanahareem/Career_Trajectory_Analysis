name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://bhuuuuu:$HF_TOKEN@huggingface.co/spaces/bhuuuuu/Career-Trajectory-Analysis main:main
